name: Android ARM64 pydantic-core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64 Python 3.14 wheel
    runs-on: ubuntu-latest

    env:
      ANDROID_API_LEVEL: "24"
      CIBW_BUILD: "cp314-android_arm64_v8a"
      CIBW_ARCHS_ANDROID: "arm64_v8a"
      CIBW_TEST_SKIP: "*-android_arm64_v8a"
      CIBW_BUILD_VERBOSITY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-24" "ndk;30.0.16248370"

      - name: Verify Android toolchain
        run: |
          echo "=== HOST ==="
          uname -a
          python --version
          python -m pip --version

          echo
          echo "=== ANDROID ==="
          echo "ANDROID_API_LEVEL=${ANDROID_API_LEVEL}"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          echo
          echo "=== NDK ==="
          find "${ANDROID_SDK_ROOT}/ndk" -maxdepth 2 -type f \
            -name "clang" | head -20 || true

      - name: Download pydantic-core source
        run: |
          rm -rf build/source build/work dist
          mkdir -p build/source build/work dist

          python -m pip download \
            --no-binary=:all: \
            --no-deps \
            --dest build/source \
            "pydantic-core"

          ls -lh build/source

      - name: Extract pydantic-core
        run: |
          tar -xf build/source/pydantic_core-*.tar.gz \
            -C build/work \
            --strip-components=1

          echo "=== SOURCE ==="
          sed -n '1,220p' build/work/pyproject.toml

          echo
          echo "=== CARGO ==="
          sed -n '1,220p' build/work/Cargo.toml

      - name: Check Maturin availability
        run: |
          python -m pip index versions maturin | head -30

          echo
          echo "=== Requested build backend ==="
          grep -n "maturin" build/work/pyproject.toml || true

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cibuildwheel

    python -m pip show cibuildwheel

      - name: Build Android wheel
        run: |
          cd build/work

          python -m cibuildwheel \
            --platform android \
            --only cp314-android_arm64_v8a \
            --output-dir ../../dist

      - name: Inspect wheel
        run: |
          set -eux

          echo "=== WHEELS ==="
          ls -lah dist

          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if not wheels:
              raise SystemExit("NO WHEEL GENERATED")

          for wheel in wheels:
              print("\nWHEEL:", wheel)
              with zipfile.ZipFile(wheel) as z:
                  names = z.namelist()
                  native = [
                      n for n in names
                      if n.endswith(".so")
                  ]

                  print("Native libraries:")
                  for n in native:
                      print(" ", n)

                  if not native:
                      raise SystemExit(
                          "FAIL: wheel contains no native .so"
                      )
          PY

      - name: Verify wheel architecture
        run: |
          set -eux

          mkdir -p wheel-check
          python -m pip install --upgrade wheel

          python - <<'PY'
          import glob
          import zipfile
          import os

          wheels = glob.glob("dist/*.whl")

          for wheel in wheels:
              print("Checking:", wheel)

              with zipfile.ZipFile(wheel) as z:
                  for name in z.namelist():
                      if name.endswith(".so"):
                          data = z.read(name)
                          path = "/tmp/check.so"

                          with open(path, "wb") as f:
                              f.write(data)

                          print("Native object:", name)
                          os.system(
                              "file " + path
                          )
          PY

      - name: SHA256
        run: |
          sha256sum dist/*.whl

      - name: Upload Android wheel
        uses: actions/upload-artifact@v4
        with:
          name: pydantic-core-android-arm64-python314
          path: dist/*.whl
          if-no-files-found: error
